name: NERIS Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Backend Validation, SAM Compliance & E2E Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate AWS SAM Infrastructure Template
        run: |
          sam validate -t template.yaml

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Full System Automated Test Matrix
        env:
          ENVIRONMENT: development
          AWS_REGION: ap-south-1
        run: |
          python scratch/test_all_7_tabs_e2e.py

      - name: Install Frontend Node Dependencies & Verify Production Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
