version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix frontend install
    build:
      commands:
        - npm --prefix frontend run build
        - python -c "import shutil; shutil.copytree('frontend/dist', 'dist', dirs_exist_ok=True)"
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
